repos:
  - repo: local
    hooks:
      - id: update-schema-docs
        name: Update schema documentation
        entry: node scripts/update-attribute-docs.js
        language: node
        files: ^attributes/.*/schema\.json$|^attributes/.*/README\.md$
        pass_filenames: false
        require_serial: true
        additional_dependencies: [wetzel@0.2.3]
